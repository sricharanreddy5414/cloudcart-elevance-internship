# Local EverShop development stack.
#
# Image index digests were read from Docker Hub on 17 November 2026.
# The mutable tag "latest" is not used.
# EverShop index: sha256:385934128c115f0ea92df17f5d70998532208d4a94b9b6b28149af74b5b3f6b2
# PostgreSQL 16 index: sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
#
# The database is reachable only on the Docker network. Port 5432 is not published.
# The named volume is postgres-data. Do not run `docker compose down -v`.
# Do not point this file at a different volume until `docker volume ls` has been checked
# on the machine that already runs the store.

name: cloudcart

services:
  app:
    image: evershop/evershop@sha256:385934128c115f0ea92df17f5d70998532208d4a94b9b6b28149af74b5b3f6b2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - myevershop
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',function(r){process.exit(r.statusCode<500?0:1)}).on('error',function(){process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  database:
    image: postgres@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - myevershop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  myevershop:
    name: myevershop
    driver: bridge

volumes:
  postgres-data:
    name: postgres-data
