version: 0.2

phases:
  pre_build:
    commands:
      - echo "Build uses the CodeBuild role. No keys are stored in this file."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - docker build --pull -f application/docker/Dockerfile -t "$ECR_REGISTRY/$ECR_REPOSITORY:$CODEBUILD_RESOLVED_SOURCE_VERSION" .
      - docker image inspect "$ECR_REGISTRY/$ECR_REPOSITORY:$CODEBUILD_RESOLVED_SOURCE_VERSION" --format '{{index .RepoDigests 0}}'
  post_build:
    commands:
      - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - DIGEST=$(docker image inspect "$ECR_REGISTRY/$ECR_REPOSITORY:$CODEBUILD_RESOLVED_SOURCE_VERSION" --format '{{index .RepoDigests 0}}')
      - echo "$DIGEST" | grep -q '@sha256:'
      - printf '{"ImageURI":"%s"}\n' "$DIGEST" > imageDetail.json
      - sed -e "s|<EXECUTION_ROLE_ARN>|${EXECUTION_ROLE_ARN}|" -e "s|<TASK_ROLE_ARN>|${TASK_ROLE_ARN}|" -e "s|<DB_SECRET_ARN>|${DB_SECRET_ARN}|" -e "s|<DB_HOST_PARAMETER>|${DB_HOST_PARAMETER}|" -e "s|<LOG_GROUP>|${LOG_GROUP}|" ci-cd/codedeploy/taskdef.json > taskdef.json

artifacts:
  files:
    - imageDetail.json
    - taskdef.json
    - ci-cd/codedeploy/appspec.yaml
